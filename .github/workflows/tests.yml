# Fuehrt bei jedem Push und Pull-Request die automatischen Tests aus (node --test, keine Abhaengigkeiten).
# Diese Datei einmalig als  .github/workflows/tests.yml  ins Repo legen.
name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Konto-Skript ist aktuell gebaut
        run: python3 tools/build-account.py --check
      - name: Tests
        run: node --test "tests/*.test.js"
