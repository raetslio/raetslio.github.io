  <script>
  /* Darstellung früh setzen (verhindert Aufblitzen): gespeicherte Wahl oder Geräteeinstellung */
  (function () { try { var m = /^\/login\/?/.test(location.pathname) ? 'system' : (localStorage.getItem('rs_theme') || 'system'); var d = m === 'dark' || (m !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); if (d) document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {} })();

  <script>
  /* Anmeldepflicht (Teil 1): Ohne gespeicherte Anmeldung sofort zur Anmeldeseite. Die Seite bleibt bis zur Prüfung unsichtbar.
     Die eigentliche Prüfung der Sitzung macht js/account.js. Einladungs-/Passwort-Links (#...type=...) bleiben erhalten. */
  (function () {
    var onLogin = /^\/login\/?(index\.html)?$/.test(location.pathname);
    var onSupport = /^\/support\/?(index\.html)?$/.test(location.pathname); /* Support ist auch ohne Anmeldung erreichbar */
    window.__rsGate = !onLogin;
    if (onLogin) return;
    var has = false; try { has = !!localStorage.getItem('sb-dnhjzlnbuqmyqgjxxygx-auth-token'); } catch (e) {}
    if (!has && onSupport) { document.documentElement.classList.add('rs-anon-support'); return; }
    if (!has) {
      var next = location.pathname + location.search;
      location.replace('/login/?next=' + encodeURIComponent(next) + location.hash);
      return;
    }
    /* Bis die Sitzung geprüft ist: Inhalt verbergen, aber Logo und Ladering zeigen (statt weißer Seite) */
    var st = document.createElement('style'); st.id = 'rs-gate-css';
    st.textContent = 'html.rs-gating body{visibility:hidden}'
      + 'html.rs-gating::before{content:"";position:fixed;inset:0;z-index:2147483646;visibility:visible;background:#f5f6f5 url(/logo-icon.svg) center/56px 56px no-repeat}'
      + 'html.rs-gating::after{content:"";position:fixed;top:50%;left:50%;width:84px;height:84px;margin:-42px 0 0 -42px;box-sizing:border-box;border:3px solid rgba(60,90,110,.18);border-top-color:#3c5a6e;border-radius:50%;z-index:2147483647;visibility:visible;animation:rs-gate-spin 1s linear infinite}'
      + 'html[data-theme="dark"].rs-gating::before{background-color:#1c2023}'
      + 'html[data-theme="dark"].rs-gating::after{border-color:rgba(157,184,204,.2);border-top-color:#9db8cc}'
      + '@keyframes rs-gate-spin{to{transform:rotate(360deg)}}'
      + '@media (prefers-reduced-motion:reduce){html.rs-gating::after{animation-duration:3s}}';
    document.head.appendChild(st); document.documentElement.classList.add('rs-gating');
    window.__rsReveal = function () { var s = document.getElementById('rs-gate-css'); if (s) s.remove(); document.documentElement.classList.remove('rs-gating'); };
    setTimeout(window.__rsReveal, 5000); /* Notausgang: gespeicherte Anmeldung vorhanden, aber Dienst nicht erreichbar */
  })();
  </script>

  <!-- Gemeinsames Markup und alle Skripte liegen einmalig in /app-body.html (Quelle der Wahrheit fuer die Oberflaeche). -->
  <script>
  (function () {
    try { var x = new XMLHttpRequest(); x.open('GET', '/app-body.html', false); x.send(); if (x.status < 200 || x.status >= 300) throw 0; try { var re = /<script[^>]+src="([^"]+)"/g, m, h = document.head; while ((m = re.exec(x.responseText))) { var l = document.createElement('link'); l.rel = 'preload'; l.as = 'script'; l.href = m[1]; h.appendChild(l); } } catch (e2) {} /* alle Skripte parallel vorladen (statt eins nach dem anderen) */
      document.write(x.responseText); }
    catch (e) {
      /* Totalausfall: gestaltete Fehlerseite statt nacktem Absatz */
      document.write('<style>body{margin:0;background:#f5f6f5;color:#23272a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}'
        + '@media (prefers-color-scheme:dark){body{background:#1c2023;color:#e6e9e7}.rs-err a{color:#9db8cc;border-color:#9db8cc}.rs-err button{background:#9db8cc;color:#1c2023}}'
        + '.rs-err{max-width:28rem;margin:0 auto;padding:18vh 24px 24px;text-align:center;line-height:1.55}.rs-err img{width:64px;height:64px}'
        + '.rs-err h1{font-size:1.4rem;margin:16px 0 8px}.rs-err p{margin:0 0 22px;opacity:.85}.rs-err .b{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}'
        + '.rs-err button,.rs-err a{min-height:44px;padding:0 20px;border-radius:12px;font:600 1rem inherit;font-family:inherit;display:inline-flex;align-items:center;text-decoration:none;box-sizing:border-box;cursor:pointer}'
        + '.rs-err button{border:0;background:#3c5a6e;color:#fff}.rs-err a{border:2px solid #3c5a6e;color:#3c5a6e}</style>'
        + '<div class="rs-err" role="alert"><img src="/logo-icon.svg" alt="">'
        + '<h1>Rätslio? konnte nicht geladen werden</h1>'
        + '<p id="rs-err-msg">Das ist meistens ein kurzes Verbindungsproblem. Bitte prüfe deine Internetverbindung und versuche es noch einmal.</p>'
        + '<div class="b"><button type="button" onclick="location.reload()">Neu laden</button><a id="rs-err-off" href="" hidden>Offline weiterspielen</a></div></div>');
      document.addEventListener('DOMContentLoaded', function () {
        var m = document.getElementById('rs-err-msg'), o = document.getElementById('rs-err-off');
        if (navigator.onLine === false && m) m.textContent = 'Du bist gerade offline. Sobald die Verbindung wieder da ist, kannst du neu laden.';
        /* Nur anbieten, wenn die App schon einmal auf diesem Gerät zwischengespeichert wurde */
        try { if (o && window.caches) caches.match('/app-body.html', { ignoreSearch: true }).then(function (r) { if (r) o.hidden = false; }); } catch (x) {}
      });
    }
  })();
  </script>
